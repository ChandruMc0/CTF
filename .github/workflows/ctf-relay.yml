name: ctf-relay

on:
  push:
    branches: [arena/01a0dc09-ctf]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run relay command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          # list command files at this SHA, pick the newest
          FILES=$(gh api "repos/$REPO/contents/relay/cmd?ref=$SHA" --jq '.[].name' | grep '\.py$' | sort | tail -1)
          if [ -z "$FILES" ]; then echo "no command file at $SHA"; exit 0; fi
          echo ">>> Running relay/cmd/$FILES"
          gh api "repos/$REPO/contents/relay/cmd/$FILES?ref=$SHA" --jq '.content' | base64 -d > /tmp/cmd.py
          python3 /tmp/cmd.py 2>&1
