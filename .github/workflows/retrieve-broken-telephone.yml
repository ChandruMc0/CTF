name: Retrieve Broken Telephone source

on:
  push:
    branches: ["arena/01a0e21b-ctf"]

permissions:
  checks: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download challenge attachment
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://ctf.h7tex.com/api/v1/challenges/broken-telephone/attachments/ff04fffe-0059-40fc-bfa1-7424ff70e0eb/download?t=1790545403.25444e66e5356f45056cbb96c6da308f8da284430cdc55b6572ed0f193e21f71' \
            --output challenge.bin
          mkdir extracted
          if unzip -q challenge.bin -d extracted; then :; else tar -xf challenge.bin -C extracted; fi
          {
            sha256sum challenge.bin
            find extracted -type f -printf '%p\n' | sort
            echo
            find extracted -type f -print0 | xargs -0 file
          } > manifest.txt
      - name: Capture a fresh tap transcript
        run: |
          python3 - <<'PY' > extracted/live-tap.txt
          import select, socket, time
          s = socket.create_connection(('pwn.h7tex.com', 40631), timeout=10)
          s.setblocking(False)
          end = time.monotonic() + 15
          buf = b''
          while time.monotonic() < end:
              readable, _, _ = select.select([s], [], [], 1)
              if not readable:
                  continue
              chunk = s.recv(65536)
              if not chunk:
                  print('EOF')
                  break
              buf += chunk
              while b'\n' in buf:
                  line, buf = buf.split(b'\n', 1)
                  print(line.decode('utf-8', 'backslashreplace'))
                  if b'"event":"ready"' in line:
                      s.sendall(b'{"cmd":"close"}\n')
                      s.close()
                      raise SystemExit
          if buf:
              print(buf.decode('utf-8', 'backslashreplace'))
          s.close()
          PY
      - name: Forge an admin provisioning request
        run: |
          python3 - <<'PY' > extracted/exploit.txt
          import json, select, socket, struct, sys, time
          sys.path.insert(0, 'extracted')
          import murmur_crypto as mc

          P = (1 << 130) - 5
          MOD128 = 1 << 128

          def trim(a):
              a = a[:]
              while a and a[-1] % P == 0:
                  a.pop()
              return a or [0]

          def sub(a, b):
              out = [0] * max(len(a), len(b))
              for i in range(len(out)):
                  out[i] = ((a[i] if i < len(a) else 0) - (b[i] if i < len(b) else 0)) % P
              return trim(out)

          def divmodp(a, b):
              a, b = trim(a), trim(b)
              q = [0] * max(1, len(a) - len(b) + 1)
              ib = pow(b[-1], -1, P)
              while a != [0] and len(a) >= len(b):
                  degree = len(a) - len(b)
                  scale = a[-1] * ib % P
                  q[degree] = scale
                  for i in range(len(b)):
                      a[i + degree] = (a[i + degree] - scale * b[i]) % P
                  a = trim(a)
              return trim(q), a

          def gcd(a, b):
              while b != [0]:
                  a, b = b, divmodp(a, b)[1]
              inv = pow(a[-1], -1, P)
              return trim([x * inv % P for x in a])

          def mac_poly(aad, ciphertext):
              wire = mc.aead_mac_data(aad, ciphertext)
              blocks = [int.from_bytes(wire[i:i + 16], 'little') + MOD128 for i in range(0, len(wire), 16)]
              out = [0] * (len(blocks) + 1)
              for i, block in enumerate(blocks):
                  out[len(blocks) - i] = block % P
              return trim(out)

          def evaluate(poly, x):
              total = 0
              for coefficient in reversed(poly):
                  total = (total * x + coefficient) % P
              return total

          def recover_poly_key(frames):
              ciphers = [frame[1] for frame in frames]
              tags = [int.from_bytes(frame[2], 'little') for frame in frames]
              polys = [mac_poly(b'\x01', ciphertext) for ciphertext in ciphers]
              for carry_a in range(-5, 6):
                  one = sub(polys[0], polys[1])
                  one[0] = (one[0] - (tags[0] - tags[1]) - carry_a * MOD128) % P
                  for carry_b in range(-5, 6):
                      two = sub(polys[0], polys[2])
                      two[0] = (two[0] - (tags[0] - tags[2]) - carry_b * MOD128) % P
                      common = gcd(one, two)
                      if len(common) != 2:
                          continue
                      r = (-common[0] * pow(common[1], -1, P)) % P
                      offsets = [(tags[i] - evaluate(polys[i], r)) % MOD128 for i in range(len(frames))]
                      if len(set(offsets)) == 1:
                          return r, offsets[0]
              raise RuntimeError('could not recover the reused Poly1305 key')

          def tag_for(r, s, aad, ciphertext):
              return ((evaluate(mac_poly(aad, ciphertext), r) + s) % MOD128).to_bytes(16, 'little')

          sock = socket.create_connection(('pwn.h7tex.com', 40631), timeout=10)
          sock.setblocking(False)
          events, buf = [], b''
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              readable, _, _ = select.select([sock], [], [], 1)
              if not readable:
                  continue
              chunk = sock.recv(65536)
              if not chunk:
                  raise RuntimeError('tap closed before ready')
              buf += chunk
              while b'\n' in buf:
                  line, buf = buf.split(b'\n', 1)
                  event = json.loads(line)
                  events.append(event)
                  if event.get('event') == 'ready':
                      deadline = 0
                      break

          wires = [event for event in events if event.get('event') == 'wire']
          msg1 = bytes.fromhex(wires[0]['data'])
          msg2 = bytes.fromhex(wires[1]['data'])
          static = bytes.fromhex('15e8896ef9b0d92253ba8e4f8b96d8600648a4b4f2f299ae1a4ece8c6db71b16')
          ss = mc.SymmetricState()
          ss.mix_hash(b'')
          ss.mix_hash(static)
          ss.mix_hash(msg1[:32])
          ss.mix_hash(msg1[32:])
          ss.mix_hash(msg2[:32])
          ss.mix_hash(msg2[32:])
          h2 = ss.h

          inbound = b''.join(bytes.fromhex(event['data']) for event in wires[3:] if event['dir'] == 'n2g')
          frames, offset, index = [], 0, 0
          while offset < len(inbound):
              size = int.from_bytes(inbound[offset:offset + 2], 'little') ^ mc.length_mask(h2, index)
              body = inbound[offset + 2:offset + 2 + size]
              frames.append((body[0], body[1:-16], body[-16:]))
              offset += 2 + size
              index += 1

          controls = [frame for frame in frames if frame[0] == mc.TYPE_CONTROL]
          # Every packet was sealed with nonce zero.  The observed empty outbound
          # controls therefore provide the responder's ChaCha20 keystream too.
          outbound = b''.join(bytes.fromhex(event['data']) for event in wires[3:] if event['dir'] == 'g2n')
          outbound_frames, offset, out_index = [], 0, 0
          while offset < len(outbound):
              size = int.from_bytes(outbound[offset:offset + 2], 'little') ^ mc.length_mask(h2, out_index)
              body = outbound[offset + 2:offset + 2 + size]
              outbound_frames.append((body[0], body[1:-16], body[-16:]))
              offset += 2 + size
              out_index += 1
          outbound_stream = max((frame[1] for frame in outbound_frames if frame[0] == mc.TYPE_CONTROL), key=len)
          r, s = recover_poly_key(controls[:4])
          stream = max((frame[1] for frame in controls), key=len)
          plaintext = b'\x01\x01\x00\x00' + b'\x00' * 96
          ciphertext = bytes(a ^ b for a, b in zip(stream[:len(plaintext)], plaintext))
          body = bytes([mc.TYPE_CONTROL]) + ciphertext + tag_for(r, s, bytes([mc.TYPE_CONTROL]), ciphertext)
          forged = struct.pack('<H', len(body) ^ mc.length_mask(h2, 0)) + body
          sock.sendall(json.dumps({'cmd': 'inject', 'data': forged.hex()}).encode() + b'\n')

          print('h2', h2.hex())
          print('poly_r', hex(r))
          print('injected', forged.hex())
          deadline = time.monotonic() + 12
          while time.monotonic() < deadline:
              readable, _, _ = select.select([sock], [], [], 1)
              if not readable:
                  continue
              chunk = sock.recv(65536)
              if not chunk:
                  break
              buf += chunk
              while b'\n' in buf:
                  line, buf = buf.split(b'\n', 1)
                  print(line.decode('utf-8', 'backslashreplace'))
                  event = json.loads(line)
                  if event.get('event') == 'wire' and event.get('dir') == 'g2n':
                      raw = bytes.fromhex(event['data'])
                      size = int.from_bytes(raw[:2], 'little') ^ mc.length_mask(h2, len(outbound_frames))
                      body = raw[2:2 + size]
                      if body[0] == mc.TYPE_CONTROL:
                          plaintext = bytes(a ^ b for a, b in zip(body[1:-16], outbound_stream))
                          print('decrypted-control', plaintext.hex(), repr(plaintext))
                          if plaintext[:1] == b'\x02':
                              secret_length = int.from_bytes(plaintext[1:3], 'little')
                              print('secret', plaintext[3:3 + secret_length].decode('utf-8', 'replace'))
          sock.close()
          PY
      - name: Publish manifest and textual challenge files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local name=$1 body=$2 output
            output=$(mktemp)
            {
              printf '## `%s`\n\n```text\n' "$name"
              cat "$body"
              printf '\n```\n'
            } > "$output"
            jq -n --arg name "Broken Telephone: $name" --arg sha "$GITHUB_SHA" --rawfile summary "$output" \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"success", output:{title:$name, summary:$summary}}' \
              | curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                  -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' -d @- > /dev/null
          }
          publish manifest.txt manifest.txt
          publish MURMUR-1.2.md extracted/MURMUR-1.2.md
          publish murmur_crypto.py extracted/murmur_crypto.py
          publish live-tap.txt extracted/live-tap.txt
          publish exploit.txt extracted/exploit.txt
