name: Retrieve Broken Telephone source

on:
  push:
    branches: ["arena/01a0e21b-ctf"]

permissions:
  checks: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download challenge attachment
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://ctf.h7tex.com/api/v1/challenges/broken-telephone/attachments/ff04fffe-0059-40fc-bfa1-7424ff70e0eb/download?t=1790545403.25444e66e5356f45056cbb96c6da308f8da284430cdc55b6572ed0f193e21f71' \
            --output challenge.bin
          mkdir extracted
          if unzip -q challenge.bin -d extracted; then :; else tar -xf challenge.bin -C extracted; fi
          {
            sha256sum challenge.bin
            find extracted -type f -printf '%p\n' | sort
            echo
            find extracted -type f -print0 | xargs -0 file
          } > manifest.txt
      - name: Publish manifest and textual challenge files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local name=$1 body=$2 output
            output=$(mktemp)
            {
              printf '## `%s`\n\n```text\n' "$name"
              cat "$body"
              printf '\n```\n'
            } > "$output"
            jq -n --arg name "Broken Telephone: $name" --arg sha "$GITHUB_SHA" --rawfile summary "$output" \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"success", output:{title:$name, summary:$summary}}' \
              | curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                  -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' -d @- > /dev/null
          }
          publish manifest.txt manifest.txt
          publish MURMUR-1.2.md extracted/MURMUR-1.2.md
          publish murmur_crypto.py extracted/murmur_crypto.py
