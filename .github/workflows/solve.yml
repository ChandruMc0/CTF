name: solve
on:
  push:
    branches: [ arena/01a0dc28-ctf ]
    paths: [ 'scripts/solve.py', '.github/workflows/solve.yml' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run solver
        run: |
          mkdir -p results
          set +e
          python3 scripts/solve.py > results/output.txt 2>&1
          echo "solver exit: $?"
          cp -f flag.txt results/flag.txt 2>/dev/null || true
          echo "----- OUTPUT -----"
          cat results/output.txt
      - name: Emit annotations
        if: always()
        run: |
          while IFS= read -r line; do
            echo "::notice::${line}"
          done < results/output.txt
      - name: Commit results back
        if: always()
        continue-on-error: true
        run: |
          git config user.name "ctf-runner"
          git config user.email "ctf-runner@users.noreply.github.com"
          git add -f results/output.txt results/flag.txt
          git commit -m "ci: solver results [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/01a0dc28-ctf || echo "push failed"
