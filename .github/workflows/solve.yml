name: solve
on:
  push:
    branches: [ arena/01a0dc28-ctf ]
    paths: [ 'scripts/solve.py', '.github/workflows/solve.yml' ]
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run solver
        run: python3 scripts/solve.py
      - name: Upload flag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flag
          path: flag.txt
          if-no-files-found: ignore
