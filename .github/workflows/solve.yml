name: solve
on:
  push:
    branches: [ arena/01a0dc28-ctf ]
    paths: [ 'scripts/solve.py', '.github/workflows/solve.yml' ]
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run solver
        run: |
          mkdir -p results
          python3 scripts/solve.py 2>&1 | tee results/output.txt
          cp -f flag.txt results/flag.txt 2>/dev/null || true
      - name: Commit results back
        if: always()
        run: |
          git config user.name "ctf-runner"
          git config user.email "ctf-runner@users.noreply.github.com"
          git add -f results/output.txt results/flag.txt || true
          git commit -m "ci: solver results [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/01a0dc28-ctf
