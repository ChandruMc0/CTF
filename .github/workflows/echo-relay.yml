name: echo-relay

on:
  push:
    branches:
      - arena/01a0df00-ctf
    paths:
      - 'relay/**'
      - '.github/workflows/echo-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run relay
        shell: bash
        run: |
          set +e
          python3 relay/relay.py > /tmp/relay_out.txt 2>&1
          code=$?
          echo "relay_exit=$code" >> /tmp/relay_out.txt
          cat > /tmp/pub.pem <<'PUB'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0WzfW2atcf/c1FucHpfO
          RGOnZBjyi5FufPp9RotCF8DhNovP8nxR1DkPaIb88XX1oZuuAdnV79n3J+oUowGB
          4+IR2YywA7hdBHr/kkIksxdhWjiNVcze5wF2Jrl0WkIrfP+GpIxbXrjaE9ZQYxCS
          lF7mhVvFfLOvp7NSCYUmDG4DRxgqUXdhFrFvVNVON7g02c6ik/GmUT09+PZCBkPz
          TfRbWHt7QnzmH9Oz4PYvK5/ev6DwuqajMqurLfELAlgLlznAeFxg8GbzQB+SU96u
          4saghzVD1Tn2ItDxaZT8Fka7q2XBCxK55E0jQnKKsSIp3fDRseoMxgzhT4EK8otn
          3QIDAQAB
          -----END PUBLIC KEY-----
          PUB
          KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s %s' "$KEY" "$IV" > /tmp/sym.txt
          openssl enc -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/relay_out.txt -out /tmp/relay_out.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/sym.txt -out /tmp/sym.enc
          mkdir -p .relay-output
          {
            echo '---BEGIN_SYM---'
            base64 -w0 /tmp/sym.enc; echo
            echo '---END_SYM---'
            echo '---BEGIN_DATA---'
            base64 -w0 /tmp/relay_out.enc; echo
            echo '---END_DATA---'
          } > .relay-output/${GITHUB_RUN_ID}.txt
          cp .relay-output/${GITHUB_RUN_ID}.txt .relay-output/last.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .relay-output/${GITHUB_RUN_ID}.txt .relay-output/last.txt
          git commit -m "relay output ${GITHUB_RUN_ID} [skip ci]" || true
          git push origin HEAD:arena/01a0df00-ctf || true
          echo 'encrypted relay output committed to .relay-output/last.txt'
          exit 0
