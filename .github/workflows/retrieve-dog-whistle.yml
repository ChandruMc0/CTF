name: Retrieve Dog Whistle source

on:
  push:
    branches: ["arena/01a0e21b-ctf"]

permissions:
  checks: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Download and list the attachment
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://ctf.h7tex.com/api/v1/challenges/dog-whistle/attachments/b33b6b24-7c55-4876-b3c1-35ec6904a1f7/download?t=1790546275.15f2496600d3df0270a8c64e9eaa4da7bd1b03aab72a1207ecc660892154df03' \
            --output challenge.bin
          mkdir extracted
          if unzip -q challenge.bin -d extracted; then :; else tar -xf challenge.bin -C extracted; fi
          {
            sha256sum challenge.bin
            find extracted -type f -printf '%p\n' | sort
            echo
            find extracted -type f -print0 | xargs -0 file
          } > manifest.txt
          {
            ls -lh extracted/aria
            echo '== dynamic symbols =='
            readelf --wide --dyn-syms extracted/aria
            echo '== strings =='
            strings -a -n 3 extracted/aria
            echo '== disassembly =='
            objdump -d -M intel --no-show-raw-insn extracted/aria
          } > aria-analysis.txt
          base64 -w0 extracted/aria > aria.b64
      - name: Publish reference material
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local label=$1 source=$2 summary
            summary=$(mktemp)
            { printf '## `%s`\n\n```text\n' "$label"; cat "$source"; printf '\n```\n'; } > "$summary"
            jq -n --arg name "Dog Whistle: $label" --arg sha "$GITHUB_SHA" --rawfile summary "$summary" \
              '{name:$name,head_sha:$sha,status:"completed",conclusion:"success",output:{title:$name,summary:$summary}}' \
              | curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                  -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' -d @- > /dev/null
          }
          publish manifest.txt manifest.txt
          publish SPEC.md extracted/SPEC.md
          publish eq.cfg extracted/eq.cfg
          publish aria-analysis.txt aria-analysis.txt
          publish aria.b64 aria.b64
